{% extends 'base.html' %}

{% block content %}
<div class="register-container">
    <h2>📝 Register</h2>
    <form method="post" class="register-form">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p class="login-text">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</div>

<!-- Embedded Styling -->
<style>
    body {
        background-color: #1c0029;
        font-family: 'Segoe UI', sans-serif;
        color: #ffd700;
    }

    .register-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 30px;
        background-color: #2c003e;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        text-align: center;
    }

    .register-container h2 {
        margin-bottom: 20px;
        color: #ffcc33;
    }

    .register-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .register-form input {
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #3f005c;
        color: #ffd700;
        font-size: 16px;
    }

    .register-form input::placeholder {
        color: #e0c065;
    }

    .register-form button {
        padding: 12px;
        background-color: #ffd700;
        color: #2c003e;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .register-form button:hover {
        background-color: #ffcc00;
    }

    .login-text {
        margin-top: 15px;
        color: #e8d98a;
    }

    .login-text a {
        color: #ffcc33;
        text-decoration: none;
        font-weight: bold;
    }

    .login-text a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
