{% extends 'base.html' %}

{% block content %}
<div class="edit-container">
    <h2>✏️ Edit Expense</h2>
    <form method="post" class="edit-form">
        <input type="date" name="date" value="{{ expense.date }}" required>
        <input type="text" name="description" value="{{ expense.description }}" required>
        <input type="text" name="category" value="{{ expense.category }}" required>
        <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" min="1" required>
        <button type="submit">Update</button>
    </form>
    <a class="back-link" href="{{ url_for('main.index') }}">← Back</a>
</div>

<!-- Embedded Styling -->
<style>
    body {
        background-color: #1c0029;
        font-family: 'Segoe UI', sans-serif;
        color: #ffd700;
    }

    .edit-container {
        max-width: 450px;
        margin: 80px auto;
        padding: 30px;
        background-color: #2c003e;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        text-align: center;
    }

    .edit-container h2 {
        color: #ffcc33;
        margin-bottom: 25px;
    }

    .edit-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .edit-form input {
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #3f005c;
        color: #ffd700;
        font-size: 16px;
    }

    .edit-form input::placeholder {
        color: #e0c065;
    }

    .edit-form button {
        padding: 12px;
        background-color: #ffd700;
        color: #2c003e;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .edit-form button:hover {
        background-color: #ffcc00;
    }

    .back-link {
        display: block;
        margin-top: 20px;
        color: #e8d98a;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link:hover {
        text-decoration: underline;
        color: #ffcc33;
    }
</style>
{% endblock %}
